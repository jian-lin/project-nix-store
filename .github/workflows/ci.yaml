name: CI
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  NIX_ABORT_ON_WARN: 1
jobs:
  nix-flake-check:
    name: lint - main (nix flake check)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &install-nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - run: nix flake check --all-systems
  zizmor:
    name: lint - zizmor (online mode)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-nix
      - run: nix run .#zizmor -- . --verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  check-links:
    name: lint - links
    uses: $/.github/workflows/check-links.yaml
  generate-build-matrix:
    name: build - plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - *checkout
      - *install-nix
      - id: generate
        run: |
          matrix=$(nix eval --json .#ci.matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build - ${{ matrix.system }}.${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: generate-build-matrix
    strategy:
      matrix: ${{ fromJSON(needs.generate-build-matrix.outputs.matrix) }}
    steps:
      - *checkout
      - *install-nix
      - run: nix build --print-build-logs .#"$attrPath"
        env:
          attrPath: ${{ matrix.attrPath }}
